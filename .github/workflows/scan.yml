name: Pobierz oferty z zablokowanych serwisów
on:
  schedule:
    # 9:25 i 16:25 czasu polskiego zimą (UTC+1); latem o godzinę później
    - cron: "25 8 * * *"
    - cron: "25 15 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python scraper/fetch.py
      - name: Zapisz wyniki
        run: |
          git config user.name "rental-scanner"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Aktualizacja ofert $(date -u +%FT%RZ)"
          git push
